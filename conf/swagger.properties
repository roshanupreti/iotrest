# Swagger/OpenAPI Documentation Configuration
# Configure API documentation metadata and endpoints

# API Metadata
swagger.title=RIOT API Documentation
swagger.description=REST API for IoT Device Management with JWT Authentication
swagger.version=1.0.2

# Server Configuration
swagger.schemes=https
swagger.host=localhost:8443
swagger.basePath=/riot/docs

# Package Scanning
swagger.resourcePackage=com.project.iotrest.rest

# Contact Information (optional)
# swagger.contact=your.email@example.com
# swagger.license=MIT License
# swagger.licenseUrl=https://opensource.org/licenses/MIT

# Terms of Service URL (optional)
# swagger.termsOfServiceUrl=https://example.com/terms

# -------------------------------------------------------------------
# Environment-Specific Configuration:
# -------------------------------------------------------------------
#
# DEVELOPMENT:
# - swagger.host=localhost:8000
# - swagger.schemes=http
#
# PRODUCTION:
# - swagger.host=api.yourcompany.com
# - swagger.schemes=https
# - swagger.basePath=/v1/docs
#
# NOTES:
# - Update swagger.host for each environment
# - Use HTTPS in production (swagger.schemes=https)
# - Swagger UI will be available at: {scheme}://{host}{basePath}

