# HikariCP Connection Pool Configuration
# Configure these values based on your environment and load requirements

# Connection Pool Sizing
hikari.maximumPoolSize=10
hikari.minimumIdle=2

# Connection Timeouts (in milliseconds)
hikari.connectionTimeout=30000
hikari.idleTimeout=600000
hikari.maxLifetime=1800000

# Pool Behavior
hikari.autoCommit=true
hikari.poolName=RiotHikariPool

# Performance Tuning - Prepared Statement Cache
hikari.cachePrepStmts=true
hikari.prepStmtCacheSize=250
hikari.prepStmtCacheSqlLimit=2048

# Connection Testing
hikari.connectionTestQuery=SELECT 1

# Leak Detection (set to 0 to disable, or milliseconds to detect leaks)
# Enable in development to catch connection leaks early
hikari.leakDetectionThreshold=60000

# Metrics & Monitoring (optional - requires Micrometer/Dropwizard)
# hikari.registerMbeans=true

# -------------------------------------------------------------------
# Environment-Specific Tuning Guidelines:
# -------------------------------------------------------------------
#
# DEVELOPMENT:
# - maximumPoolSize=5-10 (low traffic)
# - leakDetectionThreshold=30000 (30s - aggressive leak detection)
#
# TEST:
# - maximumPoolSize=5 (minimal)
# - connectionTimeout=5000 (fail fast)
#
# PRODUCTION (Low Load):
# - maximumPoolSize=10-20
# - minimumIdle=5
#
# PRODUCTION (High Load):
# - maximumPoolSize=50-100
# - minimumIdle=10-20
# - Formula: connections = ((core_count * 2) + effective_spindle_count)
#
# NOTES:
# - More connections != better performance
# - HikariCP is very efficient; 10 connections can handle 1000s req/sec
# - Monitor with metrics to determine optimal pool size
# - Each connection uses ~5MB memory

